# Local stack. Everything here is free/open-source.
#   Infra only (for `npm run dev:cluster`):  docker compose up -d postgres redis jaeger
#   Full stack (2 server replicas + web):     docker compose up --build
name: collaborative-canvas

x-server: &server
  build:
    context: .
    dockerfile: apps/server/Dockerfile
  restart: unless-stopped
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
  environment: &server-env
    NODE_ENV: production
    REDIS_URL: redis://redis:6379
    DATABASE_URL: postgres://canvas:canvas@postgres:5432/canvas
    # Demo-only secret. Override with a real one: JWT_SECRET=$(openssl rand -base64 48) docker compose up
    JWT_SECRET: ${JWT_SECRET:-local-demo-secret-please-change-0123456789}
    AUTH_DEV_TOKENS: 'true'
    ALLOWED_ORIGINS: http://localhost:8080,http://localhost:5173
    OTEL_ENABLED: 'true'
    OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: canvas
      POSTGRES_PASSWORD: canvas
      POSTGRES_DB: canvas
    ports: ['5432:5432']
    volumes: ['pgdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U canvas']
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 10

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    ports:
      - '16686:16686' # UI
      - '4318:4318' # OTLP over HTTP

  server-a:
    <<: *server
    environment:
      <<: *server-env
      NODE_ID: node-a
    ports: ['4000:4000']

  server-b:
    <<: *server
    environment:
      <<: *server-env
      NODE_ID: node-b
    ports: ['4001:4000']

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_COLLAB_SERVERS: http://localhost:4000,http://localhost:4001
    environment:
      CSP_CONNECT_SRC: "'self' http://localhost:4000 ws://localhost:4000 http://localhost:4001 ws://localhost:4001"
    ports: ['8080:80']
    depends_on: [server-a, server-b]

volumes:
  pgdata:
